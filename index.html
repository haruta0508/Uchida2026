<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ルーレット</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center;
    font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
    background:linear-gradient(135deg,#fff7e6,#ffe9ef);
    color:#333;
  }
  .wrap{width:min(92vw,520px); text-align:center; padding:24px 12px}
  h1{font-size:clamp(28px,8vw,42px); margin:0 0 8px}
  .sub{margin:0 0 20px;color:#666}
  .roulette{
    width:min(82vw,380px); aspect-ratio:1/1; margin:0 auto 20px;
    border-radius:50%; overflow:hidden; position:relative;
    border:8px solid white; box-shadow:0 8px 28px #0002;
    background:#fff;
  }
  .roulette img{
    position:absolute; width:50%; height:50%; object-fit:cover;
    left:25%; top:25%; border-radius:18px;
    transition:transform .12s linear, opacity .12s linear;
  }
  .roulette.spinning img{filter:blur(1px)}
  .pointer{
    position:absolute; z-index:3; top:-3px; left:50%; transform:translateX(-50%);
    width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;
    border-top:34px solid #e53935; filter:drop-shadow(0 2px 2px #0004);
  }
  button{
    border:0; border-radius:999px; padding:14px 34px; font-size:20px; font-weight:700;
    background:#222;color:white; box-shadow:0 5px 14px #0003; cursor:pointer;
  }
  button:disabled{opacity:.5}
  #result{display:none;margin-top:20px;padding:18px;background:#fff;border-radius:22px;box-shadow:0 8px 25px #0002}
  #result h2{margin:0 0 12px;font-size:25px}
  #result img{width:min(78vw,360px);max-height:50vh;object-fit:contain;border-radius:14px}
  .again{margin-top:14px;font-size:16px;padding:10px 22px}

  .settings{margin:18px auto 0;max-width:420px;background:#fff;border-radius:18px;padding:16px;box-shadow:0 6px 20px #0002;text-align:left}
  .settings h3{margin:0 0 10px;font-size:20px}
  .prob-row{display:grid;grid-template-columns:52px 1fr 82px;gap:10px;align-items:center;margin:9px 0}
  .prob-row img{width:52px;height:52px;object-fit:cover;border-radius:10px;border:1px solid #ddd}
  .prob-row input{width:100%;padding:9px;border:1px solid #ccc;border-radius:10px;font-size:16px}
  .total{margin-top:10px;font-weight:700;text-align:right}
  .total.ok{color:#188038}.total.bad{color:#d93025}
  .hint{font-size:13px;color:#777;margin:6px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎰 ルーレット</h1>
  <p class="sub">ボタンを押してスタート！</p>

  <div class="roulette" id="roulette">
    <div class="pointer"></div>
    <img id="rouletteImg" alt="ルーレット">
  </div>

  <button id="start">ルーレットを回す！</button>

  <div id="result">
    <h2>🎉 結果は……</h2>
    <img id="resultImg" alt="当選したお菓子">
    <br>
    
  </div>
</div>

const roulette = document.getElementById("roulette");
const rouletteImg = document.getElementById("rouletteImg");
const result = document.getElementById("result");
const resultImg = document.getElementById("resultImg");
const start = document.getElementById("start");


let timer = null;

// ===== 確率設定 =====
// この配列をHTMLファイル内で直接変更してください。
// 例：[50, 20, 15, 10, 5] → それぞれ50%, 20%, 15%, 10%, 5%
// すべての数値の合計を100にしてください。
// 瀬戸しお、ミニラーメン、黒糖ドーナツ棒、ノート、ボールペン
const probabilities = [30, 15, 30, 10, 15];

function pick() {
  const total = probabilities.reduce((a, b) => a + b, 0);
  if (total !== 100) {
    console.error("確率の合計が100%ではありません。HTML内のprobabilitiesを確認してください。");
    return 0;
  }
  let r = Math.random() * total;
  for (let i = 0; i < probabilities.length; i++) {
    r -= probabilities[i];
    if (r < 0) return i;
  }
  return probabilities.length - 1;
}

function startRoulette() {
  if (window.__rouletteUsed) return;
  window.__rouletteUsed = true;
  start.disabled = true;
  result.style.display = "none";
  roulette.classList.add("spinning");

  const winner = pick();
  const begin = performance.now();
  const duration = 3200;
  let last = -1;

  function frame(now) {
    const elapsed = now - begin;
    const progress = Math.min(elapsed / duration, 1);
    // 最初は速く、最後はゆっくり
    const ease = 1 - Math.pow(1 - progress, 3);
    const index = Math.floor(ease * 18) % images.length;

    if (index !== last) {
      rouletteImg.src = images[index];
      last = index;
    }

    if (progress < 1) {
      requestAnimationFrame(frame);
    } else {
      rouletteImg.src = images[winner];
      resultImg.src = images[winner];
      roulette.classList.remove("spinning");
      result.style.display = "block";
      start.disabled = true;
    }
  }
  requestAnimationFrame(frame);
}

start.addEventListener("click", startRoulette);
rouletteImg.src = images[0];
</script>
